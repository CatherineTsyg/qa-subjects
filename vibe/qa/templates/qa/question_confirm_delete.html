{% extends "base.html" %}

{% block title %}Удаление вопроса — База ответов{% endblock %}

{% block content %}
<section class="card form-card danger-zone">
    <h1>Удалить вопрос?</h1>
    <p>Вопрос «{{ object.title }}» и все ответы к нему будут удалены безвозвратно.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a class="btn btn-secondary" href="{{ object.get_absolute_url }}">Отмена</a>
        </div>
    </form>
</section>
{% endblock %}
