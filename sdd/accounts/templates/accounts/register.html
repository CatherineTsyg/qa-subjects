{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
        <div class="form-row">
            {{ field.label_tag }}
            {{ field }}
            {{ field.errors }}
        </div>
    {% endfor %}
    <button type="submit">Зарегистрироваться</button>
</form>
<p class="meta">Уже есть учётная запись? <a href="{% url 'login' %}">Войти</a>.</p>
{% endblock %}
