{% extends "base.html" %}

{% block title %}Регистрация — База ответов{% endblock %}

{% block content %}
<section class="card form-card narrow">
    <h1>Регистрация</h1>
    <p class="muted">Создайте аккаунт, чтобы задавать вопросы и отвечать.</p>
    <form method="post">
        {% csrf_token %}
        {% include "includes/form_fields.html" with form=form %}
        <button type="submit" class="btn">Зарегистрироваться</button>
    </form>
    <p class="form-footer">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</section>
{% endblock %}
