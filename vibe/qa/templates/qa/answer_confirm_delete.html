{% extends "base.html" %}

{% block title %}Удаление ответа — База ответов{% endblock %}

{% block content %}
<section class="card form-card danger-zone">
    <h1>Удалить ответ?</h1>
    <p>Ответ и все прикреплённые к нему файлы будут удалены безвозвратно.</p>
    <blockquote class="quote">{{ object.body|truncatechars:300 }}</blockquote>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a class="btn btn-secondary" href="{{ object.question.get_absolute_url }}">Отмена</a>
        </div>
    </form>
</section>
{% endblock %}
